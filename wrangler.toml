name = "kaizen-folio-proxy"
main = "cloudflare/worker.js"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "www.kaizenfolio.com", custom_domain = true },
  { pattern = "kaizenfolio.com", custom_domain = true },
]

# The app's static files (public/) are uploaded to Cloudflare's edge on every `npx wrangler deploy`.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
ORIGIN = "https://kaizen-folio.onrender.com"
